# Principe du moindre privilège : seul le groupe "tp3-ops" peut lire
# le Secret de l'application (et uniquement celui-ci).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-tp3-app-secret
  namespace: tp3
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tp3-app-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tp3-ops-read-secret
  namespace: tp3
subjects:
  - kind: Group
    name: tp3-ops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: read-tp3-app-secret
  apiGroup: rbac.authorization.k8s.io
