apiVersion: v1
kind: ServiceAccount
metadata:
  name: tp3-app
  namespace: tp3
automountServiceAccountToken: false   # l'app n'a pas besoin de l'API Kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp3-app
  namespace: tp3
  labels: {app: tp3-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tp3-app}
  template:
    metadata:
      labels: {app: tp3-app}
    spec:
      serviceAccountName: tp3-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: tp3-app:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            # Seul le CHEMIN du secret est passé en variable, jamais sa valeur
            - name: SECRET_KEY_FILE
              value: /run/secrets/app/secret-key
          volumeMounts:
            - name: app-secrets
              mountPath: /run/secrets/app
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
      volumes:
        - name: app-secrets
          secret:
            secretName: tp3-app-secrets   # créé hors Git (kubectl create secret)
            defaultMode: 0400             # lecture seule pour le propriétaire
            items:
              - key: secret-key
                path: secret-key
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tp3-app
  namespace: tp3
spec:
  selector: {app: tp3-app}
  ports:
    - port: 80
      targetPort: 8000
